name: Release

# Every push to main:
#   1. release-please keeps the release pull request up to date (version bump + CHANGELOG.md).
#   2. CI runs; nothing below is published unless it passes.
#   3. The image is built natively for amd64 and arm64, signed and pushed to GHCR as
#      `sha-<commit>`, and `edge` moves to it.
#
# When the push is the merge of a release pull request, release-please also creates the tag and
# a draft release. The same image is additionally pushed as `1.4.2`, the moving tags `1.4`, `1`
# and `latest` follow, and only then is the release published. A release is therefore never
# visible without its image.
#
# Moving tags are set in a separate step after the build, based on the state at that moment:
# `edge` only while the commit is still the newest on main, `latest`, `1` and `1.4` only while
# the version is the newest stable one. Whichever run finishes last, a moving tag never goes back
# to an older build.
#
# Manual run ("Run workflow", then pick a release tag under "Use workflow from"): publishes the
# image and release for an existing tag. Used once to publish 1.0.0, and to recover a release
# whose run could not be re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/walkaisa/aegis

jobs:
  release-please:
    name: Release pull request
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # A GitHub App token instead of GITHUB_TOKEN, so the release pull request triggers CI.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}

  plan:
    name: Plan
    needs: release-please
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      edge: ${{ steps.plan.outputs.edge }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      major: ${{ steps.plan.outputs.major }}
      minor: ${{ steps.plan.outputs.minor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide what to publish
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          CREATED: ${{ needs.release-please.outputs.created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          if [ "$EVENT" = "workflow_dispatch" ]; then
            [[ "$GITHUB_REF" == refs/tags/v* ]] || fail "Run this workflow from a release tag (Use workflow from → Tags)."
            tag="$GITHUB_REF_NAME"
            edge=false
          elif [ "$CREATED" = "true" ]; then
            tag="$RELEASE_TAG"
            edge=true
            # The image is built from the commit that triggered this run, so it must be the
            # release commit. Otherwise publish the tag with a manual run.
            [ "$RELEASE_SHA" = "$GITHUB_SHA" ] || fail "$tag points to $RELEASE_SHA, but this run is for $GITHUB_SHA. Run this workflow manually from tag $tag."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "edge=true" >> "$GITHUB_OUTPUT"
            echo "No release in this push; publishing the edge image only."
            exit 0
          fi

          version="${tag#v}"
          [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || fail "$tag is not a semantic version tag."
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          git merge-base --is-ancestor HEAD origin/main || fail "$tag does not point to a commit on main."
          node scripts/version.mjs "$version" || fail "The versions in the code do not match $tag."

          {
            echo "release=true"
            echo "edge=$edge"
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
            echo "major=$major"
            echo "minor=$minor"
          } | tee -a "$GITHUB_OUTPUT"

  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: [plan, checks]
    if: ${{ !failure() && !cancelled() && needs.plan.result == 'success' && needs.checks.result == 'success' }}
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    # Docker's official reusable builder: one native runner per platform, SLSA provenance and
    # SBOM attestations signed with the workflow identity, multi-platform manifest at the end.
    uses: docker/github-builder/.github/workflows/build.yml@58cb9f5b71b1836d6f690c1e95effdeb9b98cb8a # v1.17.0
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      cache: true
      cache-mode: max
      sbom: true
      meta-images: ghcr.io/walkaisa/aegis
      meta-flavor: latest=false
      # Only tags that never move; `edge`, `latest`, `1` and `1.4` are set by the tags job.
      meta-tags: |
        type=sha
        type=semver,pattern={{version}},value=${{ needs.plan.outputs.tag }},enable=${{ needs.plan.outputs.release == 'true' }}
      set-meta-labels: true
      set-meta-annotations: true
      meta-labels: |
        org.opencontainers.image.title=Aegis
        org.opencontainers.image.description=A simple, self-hosted OpenID Connect provider for your own applications.
      meta-annotations: |
        org.opencontainers.image.title=Aegis
        org.opencontainers.image.description=A simple, self-hosted OpenID Connect provider for your own applications.
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  tags:
    name: Move tags
    needs: [plan, image]
    if: ${{ !failure() && !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.move.outputs.latest }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Decided now rather than in the plan, so a run that finishes late cannot move a tag back
      # to an older build. Release tags are created before their build starts, so the newest
      # version is known even while its image is still being built.
      - name: Point moving tags at this build
        id: move
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.image.outputs.digest }}
          EDGE: ${{ needs.plan.outputs.edge }}
          RELEASE: ${{ needs.plan.outputs.release }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          TAG: ${{ needs.plan.outputs.tag }}
          MAJOR: ${{ needs.plan.outputs.major }}
          MINOR: ${{ needs.plan.outputs.minor }}
        run: |
          targets=()

          if [ "$EDGE" = "true" ]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
            if [ "$head" = "$GITHUB_SHA" ]; then
              targets+=(edge)
            else
              echo "::notice::main has moved on to ${head:0:7}; its run moves edge."
            fi
          fi

          latest=false
          if [ "$RELEASE" = "true" ] && [ "$PRERELEASE" != "true" ]; then
            stable=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
              | sed 's#^refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
            newest() { printf '%s\n' "$stable" | grep -E "$1" | sort -V | tail -n 1; }
            if [ "$(newest '^v')" = "$TAG" ]; then
              targets+=(latest)
              latest=true
            fi
            [ "$(newest "^v$MAJOR\.")" = "$TAG" ] && targets+=("$MAJOR")
            [ "$(newest "^v$MAJOR\.$MINOR\.")" = "$TAG" ] && targets+=("$MAJOR.$MINOR")
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

          if [ "${#targets[@]}" -eq 0 ]; then
            echo "No moving tags point at this build."
            exit 0
          fi
          args=()
          for target in "${targets[@]}"; do
            args+=(--tag "$IMAGE:$target")
          done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
          echo "Moved \`${targets[*]}\` to \`$DIGEST\`." | tee -a "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    needs: [plan, image, tags]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.release == 'true' && needs.tags.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          LATEST: ${{ needs.tags.outputs.latest }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          # Only a manual run for a tag without a release (1.0.0) gets here without a draft.
          # Its notes come from the matching CHANGELOG.md section.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            awk -v heading="## [$VERSION]" '
              index($0, heading) == 1 { found = 1; next }
              !found { next }
              /^## / { exit }
              /^[[:space:]]*$/ { if (started) blank = blank "\n"; next }
              { started = 1; printf "%s%s\n", blank, $0; blank = "" }
            ' CHANGELOG.md > changelog-notes.md
            grep -q '[^[:space:]]' changelog-notes.md || fail "CHANGELOG.md has no section for $VERSION."
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file changelog-notes.md
          fi

          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::notice::$TAG is already published; the image tags were refreshed, the release is left as it is."
            exit 0
          fi

          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<EOF

          ### Docker image

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Digest: \`${DIGEST}\`
          EOF

          flags=(--draft=false --title "$TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          else
            flags+=(--latest="$LATEST")
          fi
          gh release edit "$TAG" "${flags[@]}"
