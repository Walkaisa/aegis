packages:
  - apps/*
  - packages/*

# Runs package scripts through pnpm's portable shell, so `NODE_ENV=production node …` works on
# Windows as well.
shellEmulator: true

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  argon2: false
  esbuild: false
  sharp: false
  unrs-resolver: false
